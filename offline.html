<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>SIPONDOK — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6f5;color:#14201d;padding:20px}
  .c{max-width:420px;background:#fff;border:1px solid #e2e8e6;border-radius:18px;padding:28px;text-align:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.3)}
  .i{width:64px;height:64px;border-radius:18px;background:#0f766e;color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
  h1{font-size:20px;margin:0 0 8px}p{color:#4b5b57;font-size:14px;line-height:1.55}
  button{background:#0f766e;color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer}
  .q{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px;font-size:13px;margin:12px 0}
  @media (prefers-color-scheme:dark){body{background:#0d1413;color:#e6efec}.c{background:#16211f;border-color:#24322f}p{color:#a9bbb6}}
</style>
</head>
<body>
<div class="c">
  <div class="i">📶</div>
  <h1>Anda sedang offline</h1>
  <p>SIPONDOK membutuhkan koneksi untuk memuat data terbaru. Data yang dicatat saat offline (presensi, setoran hafalan, presensi asrama, pelanggaran, jurnal) tersimpan aman di perangkat ini dan otomatis tersinkron saat online.</p>
  <div class="q" id="q" hidden></div>
  <button onclick="location.replace('./index.html')">Coba lagi</button>
  <p style="font-size:12px;margin-top:16px">SIPONDOK · PWA</p>
</div>
<script>
  try { var q = JSON.parse(localStorage.getItem('sp_queue') || '[]'); if (q.length) { var el = document.getElementById('q'); el.hidden = false; el.textContent = q.length + ' data offline menunggu sinkronisasi.'; } } catch (e) {}
  window.addEventListener('online', function () { location.replace('./index.html'); });
</script>
</body>
</html>
